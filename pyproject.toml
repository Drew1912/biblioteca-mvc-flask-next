[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biblioteca-console"
version = "0.1.0"
description = "Backend de consola para gestionar una biblioteca"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "Flask-Cors>=5,<7",
    "Flask-SQLAlchemy>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "textual>=0.80,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]